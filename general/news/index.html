    <title>Piceno - News</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script src="https://www.piceno.dev/scripts/core.js"></script>
    
    <link rel="stylesheet" href="https://www.piceno.dev/styles/main.css">
    <link rel="preload" href="https://www.piceno.dev/images/Piceno_Text_Light.png" as="image" type="image/png">
    <link rel="preload" href="https://www.piceno.dev/images/nav-bars.png" as="image" type="image/png">
    <link rel="prefetch" href="https://www.piceno.dev/images/nav-bars-close.png" as="image">

<body>
    <div class="Central_Background"></div> <!--Static Background-->
    
    <!--Dynamic Header Start-->
    <div class="Top_Header" id="Header_Insert"></div>
    <div class="Vertical_Nav_Menu" id="Vertical_Nav_Menu_Insert"></div>
    <!--Dynamic Header End-->
    
    <div class="container">
        
        <!--News Selection Start-->
        <section class="Sub_Head_Page">
            
            <h1 class="General_Header_1">Piceno - News</h1>

            <div class="Sliced_Div" id="news-insert">
                
                <!--News 1 Start-->
                <div class="insert_news">
                    <div class="news_container" onclick="window.open('https://www.piceno.dev/general/news/updates/2026/09/20/', '_self')">
                        <div class="news_image_preview_div">
                            <div class="news_image_preview_container">
                                <img class="news_image" src="https://www.piceno.dev/images/pages/neon-vista/1.png" alt="Neon Vista">
                            </div>
                        </div>
                        <div class="news_title_preview_div">
                            <p class="news_title">Making Progress: Neon Vista Updates</p>
                        </div>
                    </div>
                </div>
                <!--News 1 End-->
                
            </div>
            
        </section>
        <!--News Selection End-->
                    
    </div>
    
    <!--SubPage Buttons Insert-->
    <div class="Button_Projects_Container" id="Button_Projects_Container_SubPage"></div>
        
    <!--Footer Start (Place Logo on left)-->
    <div class="Footer_Filler"></div>
    <footer class="Bottom_Footer" id="Footer_Insert"></footer>
    <!--Footer End-->
