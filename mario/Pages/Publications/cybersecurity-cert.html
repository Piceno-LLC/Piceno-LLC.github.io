<body>
    <div class="Central_Background"></div> <!--Static Background-->
    
    <div class="Top_Header" id="Header_Insert"></div>
    
    <div class="container">
        <section class="Sub_Head_Page">
            <h1 class="Header_1">Certificate in Cybersecurity I & II</h1>
            <h2 class="Header_2">Mario Aguilera Piceno</h2>

            <div class="Sliced_Div">
                <br>

                
                <canvas id="pdf-canvas" width="100%" height="750" style="border: 1px solid #ccc;" class="PDF_Embed"></canvas>

                <script src="https://www.piceno.dev/PDF_JS_Legacy/build/pdf.js"></script>
                
                <script>
                    // PDF.js 2.6.347 worker
                    pdfjsLib.GlobalWorkerOptions.workerSrc = '/PDF_JS_Legacy/build/pdf.worker.min.js';
                    
                    const container = document.getElementById('pdf-container');
                    const loadingTask = pdfjsLib.getDocument('/mario/Documents/cybersecurity-certs.pdf');
                    
                    loadingTask.promise.then(function(pdf) {
                        console.log('PDF loaded successfully!');
                        console.log('Total pages:', pdf.numPages);
                    
                        // Loop through all pages
                        for (let i = 1; i <= pdf.numPages; i++) {
                            renderPage(pdf, i);
                        }
                    }).catch(function(error) {
                        console.error('Error loading PDF:', error);
                    });
                    
                    function renderPage(pdf, pageNumber) {
                        pdf.getPage(pageNumber).then(function(page) {
                            const scale = 1.5;
                            const viewport = page.getViewport({ scale: scale });
                    
                            // Create a new canvas for each page
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            
                            // Append the canvas to the container div
                            container.appendChild(canvas);
                    
                            const renderContext = {
                                canvasContext: context,
                                viewport: viewport
                            };
                    
                            return page.render(renderContext).promise;
                        }).then(function() {
                            console.log(`Page ${pageNumber} rendered successfully!`);
                        }).catch(function(error) {
                            console.error(`Error rendering page ${pageNumber}:`, error);
                        });
                    }
                </script>

                
                <canvas id="pdf-canvas-3" width="100%" height="750px" style="border: 1px solid #ccc;" class="PDF_Embed">
                    <object class="PDF_Embed" data="https://www.piceno/mario/Documents/cybersecurity-certs.pdf#view=FitW" type="application/pdf">
                        <p>Your browser does not support embedded PDFs. 
                           <a href="https://www.piceno.dev/mario/Documents/cybersecurity-certs.pdf">Download the PDF instead</a>.
                        </p>
                    </object>
                </canvas>
                
                <br>
            </div>
                    
        </section>
        
    </div>

    <!--SubPage Buttons Insert-->
